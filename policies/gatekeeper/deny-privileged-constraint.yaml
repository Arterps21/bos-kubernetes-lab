apiVersion: constraints.gatekeeper.sh/v1beta1
kind: BosPrivilegedContainers
metadata:
  name: bos-deny-privileged
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaceSelector:
      matchLabels:
        bos-security: enabled
