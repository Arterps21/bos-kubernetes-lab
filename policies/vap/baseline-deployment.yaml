apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bos-baseline-deployment
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: >
        !has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false
      message: "hostNetwork is forbidden"

    - expression: >
        !has(object.spec.template.spec.volumes) ||
        object.spec.template.spec.volumes.all(v, !has(v.hostPath))
      message: "hostPath volumes are forbidden"

    - expression: >
        has(object.spec.template.spec.securityContext) &&
        has(object.spec.template.spec.securityContext.runAsNonRoot) &&
        object.spec.template.spec.securityContext.runAsNonRoot == true &&
        (!has(object.spec.template.spec.securityContext.runAsUser) ||
         object.spec.template.spec.securityContext.runAsUser != 0) &&
        object.spec.template.spec.containers.all(c,
          !has(c.securityContext) ||
          ((!has(c.securityContext.runAsNonRoot) ||
            c.securityContext.runAsNonRoot == true) &&
           (!has(c.securityContext.runAsUser) ||
            c.securityContext.runAsUser != 0))
        ) &&
        (!has(object.spec.template.spec.initContainers) ||
         object.spec.template.spec.initContainers.all(c,
           !has(c.securityContext) ||
           ((!has(c.securityContext.runAsNonRoot) ||
             c.securityContext.runAsNonRoot == true) &&
            (!has(c.securityContext.runAsUser) ||
             c.securityContext.runAsUser != 0))
         ))
      message: "Containers must run as non-root"

    - expression: >
        object.spec.template.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.limits) &&
          'cpu' in c.resources.limits &&
          'memory' in c.resources.limits
        ) &&
        (!has(object.spec.template.spec.initContainers) ||
         object.spec.template.spec.initContainers.all(c,
           has(c.resources) &&
           has(c.resources.limits) &&
           'cpu' in c.resources.limits &&
           'memory' in c.resources.limits
         ))
      message: "CPU and memory limits are required"

    - expression: >
        object.spec.template.spec.containers.all(c,
          !c.image.startsWith('bad.registry.local/')
        ) &&
        (!has(object.spec.template.spec.initContainers) ||
         object.spec.template.spec.initContainers.all(c,
           !c.image.startsWith('bad.registry.local/')
         ))
      message: "Images from bad.registry.local are forbidden"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bos-baseline-deployment-binding
spec:
  policyName: bos-baseline-deployment
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        bos-security: enabled
