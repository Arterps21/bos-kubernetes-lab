apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bos-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Arterps21/bos-kubernetes-lab.git
    targetRevision: main
    path: apps/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: bos-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
